name: OmniShelf encrypted backup restore drill

on:
  workflow_dispatch:
    inputs:
      confirm_restore_drill:
        description: "Choose yes to restore both backups into disposable local PostgreSQL databases."
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: omnishelf-backup-restore-drill
  cancel-in-progress: false

jobs:
  restore-and-verify:
    if: ${{ inputs.confirm_restore_drill == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: us-east-005
      AWS_EC2_METADATA_DISABLED: "true"
      B2_BUCKET: omnishelf-db-backups
      B2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      NEON_MAIN_DATABASE_URL: ${{ secrets.NEON_MAIN_DATABASE_URL }}
      NEON_STAGING_DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}

    steps:
      - name: Check out restore verification code
        uses: actions/checkout@v4

      - name: Install restore and verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends awscli gnupg
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Validate connection targets and required secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          required = [
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "BACKUP_ENCRYPTION_PASSPHRASE",
              "NEON_MAIN_DATABASE_URL",
              "NEON_STAGING_DATABASE_URL",
          ]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing required GitHub Actions secrets: " + ", ".join(missing))

          expected = {
              "NEON_MAIN_DATABASE_URL": "ep-autumn-field-aoiinc7b.c-2.ap-southeast-1.aws.neon.tech",
              "NEON_STAGING_DATABASE_URL": "ep-proud-scene-ao8eewxp.c-2.ap-southeast-1.aws.neon.tech",
          }
          for name, expected_host in expected.items():
              url = urlsplit(os.environ[name])
              if url.scheme not in {"postgres", "postgresql"}:
                  raise SystemExit(f"{name} must be a PostgreSQL URL.")
              if url.hostname != expected_host or "pooler" in (url.hostname or ""):
                  raise SystemExit(f"{name} must use the correct direct Neon branch endpoint.")
              if url.path.lstrip("/").split("/", 1)[0] != "neondb":
                  raise SystemExit(f"{name} must connect to database neondb.")
              if not url.username or not url.password:
                  raise SystemExit(f"{name} is missing its database credentials.")
          if len(os.environ["BACKUP_ENCRYPTION_PASSPHRASE"]) < 32:
              raise SystemExit("Backup encryption passphrase must contain at least 32 characters.")
          print("Both direct Neon source URLs and all required secrets are present and correctly targeted.")
          PY

      - name: Download, decrypt, restore and compare both backups
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          workdir="$RUNNER_TEMP/omnishelf-restore-drill"
          mkdir -p "$workdir"
          chmod 700 "$workdir"

          # Select the newest complete encrypted backup/checksum pair for each branch.
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          bucket = os.environ["B2_BUCKET"]
          endpoint = os.environ["B2_ENDPOINT"]
          workdir = Path(os.environ["RUNNER_TEMP"]) / "omnishelf-restore-drill"
          for target in ("main", "1-3-9-staging"):
              prefix = f"omnishelf/daily/{target}/"
              result = subprocess.run(
                  [
                      "aws", "s3api", "list-objects-v2",
                      "--bucket", bucket,
                      "--prefix", prefix,
                      "--endpoint-url", endpoint,
                      "--region", "us-east-005",
                      "--output", "json",
                  ],
                  check=True, capture_output=True, text=True,
              )
              objects = json.loads(result.stdout).get("Contents", [])
              by_key = {item["Key"]: item for item in objects}
              candidates = [
                  item for item in objects
                  if item["Key"].endswith(".dump.gpg")
                  and item["Key"] + ".sha256" in by_key
              ]
              if not candidates:
                  raise SystemExit(f"No complete encrypted backup/checksum pair found for {target}.")
              latest = max(candidates, key=lambda item: item["LastModified"])
              key = latest["Key"]
              filename = PurePosixPath(key).name
              if not re.fullmatch(
                  rf"omnishelf-{re.escape(target)}-neondb-[0-9]{{8}}T[0-9]{{6}}Z\\.dump\\.gpg",
                  filename,
              ):
                  raise SystemExit(f"Unexpected backup object name for {target}.")
              archive_path = workdir / f"{target}.dump.gpg"
              checksum_path = workdir / f"{target}.dump.gpg.sha256"
              subprocess.run(
                  ["aws", "s3", "cp", f"s3://{bucket}/{key}", str(archive_path),
                   "--endpoint-url", endpoint, "--region", "us-east-005", "--only-show-errors"],
                  check=True,
              )
              checksum_key = key + ".sha256"
              raw_checksum = workdir / f"{target}.checksum.raw"
              subprocess.run(
                  ["aws", "s3", "cp", f"s3://{bucket}/{checksum_key}", str(raw_checksum),
                   "--endpoint-url", endpoint, "--region", "us-east-005", "--only-show-errors"],
                  check=True,
              )
              fields = raw_checksum.read_text(encoding="ascii").split()
              if not fields or not re.fullmatch(r"[0-9a-fA-F]{64}", fields[0]):
                  raise SystemExit(f"Invalid SHA-256 checksum file for {target}.")
              checksum_path.write_text(f"{fields[0]}  {archive_path.name}\\n", encoding="ascii")
              raw_checksum.unlink()
              print(f"Downloaded latest {target} backup: {filename} (uploaded {latest['LastModified']}).")
          PY

          cd "$workdir"
          for target in main 1-3-9-staging; do
            archive="$target.dump.gpg"
            checksum="$archive.sha256"
            sha256sum --check "$checksum"
            printf '%s\\n' "$BACKUP_ENCRYPTION_PASSPHRASE" | \
              gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --output "$target.dump" --decrypt "$archive"
            docker run --rm --volume "$workdir:/backups:ro" postgres:17-alpine \
              pg_restore --list "/backups/$target.dump" >/dev/null
            echo "Checksum, decryption, and PostgreSQL archive inspection passed for $target."
          done

          container="omnishelf-restore-drill-$GITHUB_RUN_ID"
          restore_password="$(openssl rand -hex 24)"
          echo "Starting isolated temporary PostgreSQL 17 restore server."
          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1:54329:5432 \
            --volume "$workdir:/backups:ro" \
            --env POSTGRES_PASSWORD="$restore_password" \
            postgres:17-alpine >/dev/null

          ready=false
          for attempt in $(seq 1 40); do
            if docker exec "$container" pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::Temporary PostgreSQL restore server did not become ready."
            exit 1
          fi

          # Create two separate databases inside this disposable local PostgreSQL server.
          docker exec -e PGPASSWORD="$restore_password" "$container" createdb -U postgres restored_main
          docker exec -e PGPASSWORD="$restore_password" "$container" createdb -U postgres restored_staging

          docker exec -e PGPASSWORD="$restore_password" "$container" \
            pg_restore --no-password --exit-on-error --no-owner --no-acl \
              --dbname=restored_main /backups/main.dump
          docker exec -e PGPASSWORD="$restore_password" "$container" \
            pg_restore --no-password --exit-on-error --no-owner --no-acl \
              --dbname=restored_staging /backups/1-3-9-staging.dump

          echo "Both encrypted backups restored into separate temporary databases."

          NEON_SOURCE_DATABASE_URL="$NEON_MAIN_DATABASE_URL" \
          RESTORED_DATABASE_URL="postgresql://postgres:$restore_password@127.0.0.1:54329/restored_main" \
          RESTORE_TARGET="main" \
            python scripts/verify_backup_restore.py

          NEON_SOURCE_DATABASE_URL="$NEON_STAGING_DATABASE_URL" \
          RESTORED_DATABASE_URL="postgresql://postgres:$restore_password@127.0.0.1:54329/restored_staging" \
          RESTORE_TARGET="1-3-9-staging" \
            python scripts/verify_backup_restore.py

          echo "Both restores matched their live Neon source schemas, constraints, Alembic versions, and exact table row counts."

      - name: Remove temporary restore databases and decrypted files
        if: always()
        shell: bash
        run: |
          set +e
          docker rm --force "omnishelf-restore-drill-$GITHUB_RUN_ID" >/dev/null 2>&1
          rm -rf "$RUNNER_TEMP/omnishelf-restore-drill"
          echo "Temporary PostgreSQL container and plaintext restore files removed."
