name: OmniShelf 1.3.9 checks

on:
  push:
    branches:
      - deploy/1.3.8-https-preview
    paths-ignore:
      - PROJECT_PROGRESS.md
  pull_request:
    branches:
      - main
      - deploy/1.3.8-https-preview
    paths-ignore:
      - PROJECT_PROGRESS.md

permissions:
  contents: read

jobs:
  free-deployment-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Ensure no temporary preview QA hook remains
        run: |
          if grep -nE 'temporary_preview_qa_check|OMNISHELF_TEMP_QA_TOKEN|/__private/qa-check' backend/main.py; then
            echo "Temporary QA hooks are not allowed in the preview backend." >&2
            exit 1
          fi
          echo "No temporary preview QA route or token reference remains."
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Validate free-only deployment blueprint
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("render.free.yaml").read_text())
          services = config.get("services", [])
          assert len(services) == 1, f"Expected one service, got {len(services)}"
          assert not config.get("databases"), "Free blueprint must not provision a Render database"
          service = services[0]
          assert service["name"] == "omnishelf-1-3-8-free"
          assert service["type"] == "web" and service["runtime"] == "docker"
          assert service["plan"] == "free", f"Expected free plan, got {service['plan']}"
          assert service["branch"] == "deploy/1.3.8-https-preview"
          assert service["healthCheckPath"] == "/healthz"
          env = {item["key"]: item for item in service["envVars"]}
          assert env["DATABASE_URL"].get("sync") is False, "Database URL must be a dashboard-only secret"
          assert env["REGISTRATION_ENABLED"].get("value") == "false", "Public registration must stay disabled"
          assert env["EMAIL_VERIFICATION_REQUIRED"].get("value") == "true", "Hosted account verification must stay required"
          assert env["COOKIE_SECURE"].get("value") == "true", "HTTPS-only cookies must stay enabled"
          dockerfile = Path("Dockerfile").read_text()
          assert "EXPOSE 10000" in dockerfile, "Docker image must expose Render's default HTTP port 10000"
          assert "--host 0.0.0.0" in dockerfile, "Web server must bind to all interfaces"
          assert "--port ${PORT:-10000}" in dockerfile, "Web server port must default to 10000 and honor Render PORT"
          assert dockerfile.index("python -m backend.database_target_preflight") < dockerfile.index("alembic -c backend/alembic.ini upgrade head"), "Hosted database target guard must run before migrations"
          backend = Path("backend/main.py").read_text()
          assert "OMNISHELF_STAGING_ACCEPTANCE_ENABLED" in backend
          assert "if STAGING_ACCEPTANCE_ENABLED:" in backend, "Staging hooks must be mounted conditionally"
          assert 'STAGING_ACCEPTANCE_AUDIENCE = "omnishelf-auth-staging"' in backend
          assert "STAGING_ACCEPTANCE_WORKFLOW_REF" in backend
          assert "token.actions.githubusercontent.com/.well-known/jwks" in backend
          assert "OMNISHELF_STAGING_ACCEPTANCE_ENABLED" not in env, "Staging test routes must not be enabled by the normal free blueprint"
          print("Free blueprint, Docker port, and staging-only OIDC guard are valid.")
          PY
      - name: Validate isolated 1.3.9 staging blueprint
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("render.staging.yaml").read_text())
          services = config.get("services", [])
          assert len(services) == 1, f"Expected one staging service, got {len(services)}"
          assert not config.get("databases"), "Staging must use the isolated Neon branch, not a new Render database"
          service = services[0]
          assert service["name"] == "omnishelf-1-3-9-email-recovery-staging"
          assert service["type"] == "web" and service["runtime"] == "docker"
          assert service["plan"] == "free"
          assert service["region"] == "singapore"
          assert service["branch"] == "feature/1.3.9-email-verification-password-reset"
          assert service["healthCheckPath"] == "/healthz"
          env = {item["key"]: item for item in service["envVars"]}
          assert env["DATABASE_URL"].get("sync") is False, "The privileged database URI must remain dashboard-only"
          assert env["OMNISHELF_EXPECTED_DATABASE_HOST"].get("value") == "ep-proud-scene-ao8eewxp-pooler.c-2.ap-southeast-1.aws.neon.tech"
          assert env["OMNISHELF_EXPECTED_DATABASE_NAME"].get("value") == "neondb"
          assert env["REGISTRATION_ENABLED"].get("value") == "false"
          assert env["EMAIL_VERIFICATION_REQUIRED"].get("value") == "true"
          assert env["COOKIE_SECURE"].get("value") == "true"
          assert env["OMNISHELF_SMTP_ACCEPTANCE_ENABLED"].get("value") == "false"
          assert env["OMNISHELF_STAGING_ACCEPTANCE_ENABLED"].get("value") == "false", "OIDC-authenticated staging account hooks must be off by default"
          assert env["OMNISHELF_STAGING_ACCEPTANCE_ORIGIN"].get("value") == "https://omnishelf-1-3-9-email-recovery-staging.onrender.com"
          assert env["OMNISHELF_STAGING_ACCEPTANCE_REF"].get("value") == "refs/heads/feature/1.3.9-email-verification-password-reset"
          assert env["OMNISHELF_STAGING_ACCEPTANCE_WORKFLOW_REF"].get("value") == "Reisquin/Omnishelf/.github/workflows/omnishelf-1-3-9-live-smoke.yml@refs/heads/feature/1.3.9-email-verification-password-reset"
          forbidden = {"SMTP_PASSWORD", "SMTP_USERNAME", "SMTP_HOST", "SMTP_TEST_RECIPIENT", "RESEND_API_KEY"}
          assert not forbidden.intersection(env), "SMTP/API credentials and test recipient must not be committed to the blueprint"
          assert env["EMAIL_DELIVERY_PROVIDER"].get("value") == "resend_api", "Free Render staging must use HTTPS email delivery"
          assert env["SMTP_FROM_EMAIL"].get("value") == "onboarding@resend.dev", "Only the documented Resend sandbox sender is allowed in the staging blueprint"
          print("Isolated 1.3.9 staging blueprint is Free, secret-safe, pinned to the dedicated Neon branch target, and keeps registration and SMTP acceptance disabled.")
          PY
      - name: Validate isolated 1.3.9 staging blueprint
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("render.staging.yaml").read_text())
          services = config.get("services", [])
          assert len(services) == 1, f"Expected one staging service, got {len(services)}"
          assert not config.get("databases"), "Staging must use the isolated Neon branch, not a new Render database"
          service = services[0]
          assert service["name"] == "omnishelf-1-3-9-email-recovery-staging"
          assert service["type"] == "web" and service["runtime"] == "docker"
          assert service["plan"] == "free"
          assert service["region"] == "singapore"
          assert service["branch"] == "feature/1.3.9-email-verification-password-reset"
          assert service["healthCheckPath"] == "/healthz"
          env = {item["key"]: item for item in service["envVars"]}
          assert env["DATABASE_URL"].get("sync") is False, "The privileged database URI must remain dashboard-only"
          assert env["OMNISHELF_EXPECTED_DATABASE_HOST"].get("value") == "ep-proud-scene-ao8eewxp-pooler.c-2.ap-southeast-1.aws.neon.tech"
          assert env["OMNISHELF_EXPECTED_DATABASE_NAME"].get("value") == "neondb"
          assert env["REGISTRATION_ENABLED"].get("value") == "false"
          assert env["EMAIL_VERIFICATION_REQUIRED"].get("value") == "true"
          assert env["COOKIE_SECURE"].get("value") == "true"
          assert env["OMNISHELF_SMTP_ACCEPTANCE_ENABLED"].get("value") == "false"
          assert env["OMNISHELF_STAGING_ACCEPTANCE_ENABLED"].get("value") == "false", "OIDC-authenticated staging account hooks must be off by default"
          assert env["OMNISHELF_STAGING_ACCEPTANCE_ORIGIN"].get("value") == "https://omnishelf-1-3-9-email-recovery-staging.onrender.com"
          assert env["OMNISHELF_STAGING_ACCEPTANCE_REF"].get("value") == "refs/heads/feature/1.3.9-email-verification-password-reset"
          assert env["OMNISHELF_STAGING_ACCEPTANCE_WORKFLOW_REF"].get("value") == "Reisquin/Omnishelf/.github/workflows/omnishelf-1-3-9-live-smoke.yml@refs/heads/feature/1.3.9-email-verification-password-reset"
          forbidden = {"SMTP_PASSWORD", "SMTP_USERNAME", "SMTP_HOST", "SMTP_TEST_RECIPIENT", "RESEND_API_KEY"}
          assert not forbidden.intersection(env), "SMTP/API credentials and test recipient must not be committed to the blueprint"
          assert env["EMAIL_DELIVERY_PROVIDER"].get("value") == "resend_api", "Free Render staging must use HTTPS email delivery"
          assert env["SMTP_FROM_EMAIL"].get("value") == "onboarding@resend.dev", "Only the documented Resend sandbox sender is allowed in the staging blueprint"
          print("Isolated 1.3.9 staging blueprint is Free, secret-safe, pinned to the dedicated Neon branch target, and keeps registration and SMTP acceptance disabled.")
          PY
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run isolated API tests
        env:
          DATABASE_URL: sqlite:///./omnishelf-ci-unused.db
          REGISTRATION_ENABLED: "false"
          COOKIE_SECURE: "true"
        run: python -m pytest -c backend/pytest.ini backend/tests

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Apply migrations to a fresh SQLite database
        env:
          DATABASE_URL: sqlite:///./omnishelf-migration-ci.db
          COOKIE_SECURE: "false"
          REGISTRATION_ENABLED: "false"
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini current

  frontend-layout-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install "playwright>=1.48,<2.0"
          python -m playwright install --with-deps chromium
      - name: Capture desktop and mobile layout previews
        run: |
          mkdir -p artifacts
          python -m http.server 8000 >/tmp/omnishelf-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              desktop = browser.new_page(viewport={"width": 1440, "height": 1100}, device_scale_factor=1)
              desktop_errors = []
              desktop.on("pageerror", lambda error: desktop_errors.append(str(error)))
              for attempt in range(30):
                  try:
                      desktop.goto("http://127.0.0.1:8000/index.html", wait_until="domcontentloaded", timeout=3000)
                      break
                  except Exception:
                      time.sleep(1)
              desktop.wait_for_timeout(1800)
              expected_favorites = ["Works", "Characters", "Anime", "Manga", "Novels", "Short Stories", "Arcs", "Writers", "Dynamics", "People"]
              actual_favorites = [
                  title.split("· Top 25")[0].strip()
                  for title in desktop.locator("#profileFavoritesColumn .profile-favorite-panel .panel-title").all_text_contents()
              ]
              if actual_favorites != expected_favorites:
                  raise AssertionError(f"Profile favourites are out of order: {actual_favorites}")
              if desktop_errors:
                  raise AssertionError(f"Desktop JavaScript errors: {desktop_errors}")
              desktop.screenshot(path="artifacts/omnishelf-1.3.9-desktop.png", full_page=True)

              mobile = browser.new_page(viewport={"width": 390, "height": 844}, device_scale_factor=1)
              mobile_errors = []
              mobile.on("pageerror", lambda error: mobile_errors.append(str(error)))
              mobile.goto("http://127.0.0.1:8000/index.html", wait_until="domcontentloaded")
              mobile.wait_for_timeout(1800)
              if mobile_errors:
                  raise AssertionError(f"Mobile JavaScript errors: {mobile_errors}")
              overflow = mobile.evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth")
              if overflow:
                  raise AssertionError("Mobile layout has horizontal page overflow")
              mobile.screenshot(path="artifacts/omnishelf-1.3.9-mobile.png", full_page=True)
              browser.close()
          PY
      - name: Exercise account and cloud-sync screens with an isolated mocked API
        run: python scripts/test_cloud_sync_ui.py
      - name: Upload layout preview images
        uses: actions/upload-artifact@v4
        with:
          name: omnishelf-1.3.9-layout-previews
          path: artifacts/*.png
          retention-days: 14

  postgres-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: omnishelf_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omnishelf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/omnishelf_test
      OMNISHELF_POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/omnishelf_test
      COOKIE_SECURE: "false"
      REGISTRATION_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply the versioned migrations to PostgreSQL
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Drill logical PostgreSQL backup and restore
        env:
          BACKUP_RESTORE_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/omnishelf_test
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          python scripts/backup_restore_drill.py
      - name: Test PostgreSQL sessions and concurrent cloud saves
        run: python -m pytest -c backend/pytest.ini backend/tests/test_postgres_integration.py -q

