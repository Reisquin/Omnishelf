name: OmniShelf 1.3.8 checks

on:
  push:
    branches:
      - deploy/1.3.8-https-preview
    paths-ignore:
      - PROJECT_PROGRESS.md
  pull_request:
    branches:
      - main
      - deploy/1.3.8-https-preview
    paths-ignore:
      - PROJECT_PROGRESS.md

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run isolated API tests
        env:
          DATABASE_URL: sqlite:///./omnishelf-ci-unused.db
          REGISTRATION_ENABLED: "false"
          COOKIE_SECURE: "true"
        run: python -m pytest -c backend/pytest.ini backend/tests

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Apply migrations to a fresh SQLite database
        env:
          DATABASE_URL: sqlite:///./omnishelf-migration-ci.db
          COOKIE_SECURE: "false"
          REGISTRATION_ENABLED: "false"
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini current

  frontend-layout-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install "playwright>=1.48,<2.0"
          python -m playwright install --with-deps chromium
      - name: Capture desktop and mobile layout previews
        run: |
          mkdir -p artifacts
          python -m http.server 8000 >/tmp/omnishelf-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              desktop = browser.new_page(viewport={"width": 1440, "height": 1100}, device_scale_factor=1)
              desktop.on("pageerror", lambda error: print(f"DESKTOP PAGE ERROR: {error}"))
              for attempt in range(30):
                  try:
                      desktop.goto("http://127.0.0.1:8000/index.html", wait_until="domcontentloaded", timeout=3000)
                      break
                  except Exception:
                      time.sleep(1)
              desktop.wait_for_timeout(1800)
              expected_favorites = ["Works", "Characters", "Anime", "Manga", "Novels", "Short Stories", "Arcs", "Writers", "Dynamics", "People"]
              actual_favorites = [
                  title.split("· Top 25")[0].strip()
                  for title in desktop.locator("#profileFavoritesColumn .profile-favorite-panel .panel-title").all_text_contents()
              ]
              if actual_favorites != expected_favorites:
                  raise AssertionError(f"Profile favourites are out of order: {actual_favorites}")
              desktop.screenshot(path="artifacts/omnishelf-1.3.8-desktop.png", full_page=True)

              mobile = browser.new_page(viewport={"width": 390, "height": 844}, device_scale_factor=1)
              mobile.on("pageerror", lambda error: print(f"MOBILE PAGE ERROR: {error}"))
              mobile.goto("http://127.0.0.1:8000/index.html", wait_until="domcontentloaded")
              mobile.wait_for_timeout(1800)
              mobile.screenshot(path="artifacts/omnishelf-1.3.8-mobile.png", full_page=True)
              browser.close()
          PY
      - name: Upload layout preview images
        uses: actions/upload-artifact@v4
        with:
          name: omnishelf-1.3.8-layout-previews
          path: artifacts/*.png
          retention-days: 14
