name: OmniShelf 1.3.8 live smoke checks

on:
  push:
    branches:
      - deploy/1.3.8-https-preview
    paths:
      - index.html
      - backend/**
      - Dockerfile
      - .dockerignore
      - scripts/**
      - .github/workflows/omnishelf-1-3-8-live-smoke.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install live-check dependencies
        run: |
          python -m pip install "requests>=2.32,<3" "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium

      - name: Check live health, database, HTTPS headers, and disabled registration
        run: |
          python - <<'PY'
          import json
          import time
          import requests

          base = "https://omnishelf-1-3-8-free.onrender.com"
          session = requests.Session()
          last_error = None
          health = None

          # Allow the Render Free instance to wake and complete startup migrations.
          for attempt in range(36):
              try:
                  response = session.get(base + "/healthz", timeout=20)
                  if response.status_code == 200:
                      health = response
                      payload = response.json()
                      if payload == {"status": "ok", "database": "ok", "version": "1.3.8"}:
                          break
                      last_error = f"Unexpected health payload: {payload!r}"
                  else:
                      last_error = f"Health returned HTTP {response.status_code}: {response.text[:250]}"
              except Exception as exc:
                  last_error = repr(exc)
              time.sleep(10)
          else:
              raise AssertionError(f"Live service never reached healthy PostgreSQL state: {last_error}")

          h = health.headers
          assert h.get("strict-transport-security", "").startswith("max-age="), "Missing HSTS on HTTPS health response"
          assert h.get("x-content-type-options") == "nosniff", "Missing nosniff header"

          whoami = session.get(base + "/api/auth/me", timeout=20)
          assert whoami.status_code == 200, f"Who-am-I returned HTTP {whoami.status_code}"
          assert whoami.headers.get("cache-control") == "no-store", "Auth response should be no-store"
          assert whoami.json().get("user") is None, "Unexpected session found on a fresh preview"

          # Cloud data and metadata must remain private without an authenticated session.
          anonymous_state = session.get(base + "/api/me/state", timeout=20)
          assert anonymous_state.status_code == 401, f"Anonymous cloud-state read should return 401, got {anonymous_state.status_code}"
          assert anonymous_state.headers.get("cache-control") == "no-store", "Cloud-state response should be no-store"

          # Registration must stay closed: the server checks this before origin validation.
          registration = session.post(
              base + "/api/auth/register",
              json={"username": "previewcheck", "email": "previewcheck@example.invalid", "password": "OnlyForSmokeCheck_123!"},
              timeout=20,
          )
          assert registration.status_code == 403, f"Registration must remain disabled; got HTTP {registration.status_code}"
          assert "disabled" in registration.text.lower(), "Registration-disabled response wasn't explicit"

          # The private staging test harness must not be mounted on the ordinary preview.
          staging_hook = session.post(base + "/__staging/acceptance/cleanup", timeout=20)
          assert staging_hook.status_code in (404, 405), (
              f"Staging-only harness must be unavailable on the preview; got {staging_hook.status_code}"
          )

          root = session.get(base + "/", timeout=20)
          assert root.status_code == 200, f"App root returned HTTP {root.status_code}"
          assert "OmniShelf" in root.text, "OmniShelf app shell missing at root"
          print(json.dumps({
              "health_status": health.status_code,
              "database": health.json()["database"],
              "version": health.json()["version"],
              "https_hsts": True,
              "auth_cache_control": whoami.headers.get("cache-control"),
              "anonymous_state_status": anonymous_state.status_code,
              "registration_status": registration.status_code,
              "root_status": root.status_code
          }, indent=2))
          PY

      - name: Capture deployed desktop and mobile previews
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          base = "https://omnishelf-1-3-8-free.onrender.com/"
          with sync_playwright() as p:
              browser = p.chromium.launch()
              desktop = browser.new_page(viewport={"width": 1440, "height": 1100}, device_scale_factor=1)
              desktop_errors = []
              desktop.on("pageerror", lambda err: desktop_errors.append(str(err)))
              desktop.goto(base, wait_until="domcontentloaded", timeout=60000)
              desktop.wait_for_timeout(2500)
              assert "OmniShelf" in desktop.title(), f"Unexpected title: {desktop.title()!r}"
              if desktop_errors:
                  raise AssertionError(f"Desktop JavaScript errors: {desktop_errors}")
              desktop.screenshot(path="artifacts/omnishelf-1.3.8-live-desktop.png", full_page=True)

              mobile = browser.new_page(viewport={"width": 390, "height": 844}, device_scale_factor=1)
              mobile_errors = []
              mobile.on("pageerror", lambda err: mobile_errors.append(str(err)))
              mobile.goto(base, wait_until="domcontentloaded", timeout=60000)
              mobile.wait_for_timeout(2500)
              if mobile_errors:
                  raise AssertionError(f"Mobile JavaScript errors: {mobile_errors}")
              overflow = mobile.evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth")
              if overflow:
                  raise AssertionError("Live mobile layout has horizontal page overflow")
              mobile.screenshot(path="artifacts/omnishelf-1.3.8-live-mobile.png", full_page=True)
              browser.close()
          PY

      - name: Upload live acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: omnishelf-1.3.8-live-acceptance
          path: artifacts/*.png
          retention-days: 14


  auth-staging-smoke:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install staging-check dependencies
        run: |
          python -m pip install "requests>=2.32,<3" "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium

      - name: Verify isolated staging service and closed registration
        run: |
          python - <<'PY'
          import json
          import time
          import requests

          base = "https://omnishelf-1-3-8-auth-staging.onrender.com"
          session = requests.Session()
          last_error = None
          health = None
          for attempt in range(36):
              try:
                  response = session.get(base + "/healthz", timeout=20)
                  if response.status_code == 200:
                      payload = response.json()
                      if payload == {"status": "ok", "database": "ok", "version": "1.3.8"}:
                          health = response
                          break
                      last_error = f"Unexpected health payload: {payload!r}"
                  else:
                      last_error = f"Health returned HTTP {response.status_code}: {response.text[:250]}"
              except Exception as exc:
                  last_error = repr(exc)
              time.sleep(10)
          else:
              raise AssertionError(f"Isolated staging service never reached healthy database state: {last_error}")

          assert health.headers.get("strict-transport-security", "").startswith("max-age="), "Staging missing HSTS"
          assert health.headers.get("x-content-type-options") == "nosniff", "Staging missing nosniff"

          whoami = session.get(base + "/api/auth/me", timeout=20)
          assert whoami.status_code == 200 and whoami.json().get("user") is None, "Staging should have no signed-in session"
          assert whoami.headers.get("cache-control") == "no-store", "Staging auth response should be no-store"

          state = session.get(base + "/api/me/state", timeout=20)
          assert state.status_code == 401, f"Anonymous staging cloud read should be denied, got {state.status_code}"
          assert state.headers.get("cache-control") == "no-store", "Staging cloud-state response should be no-store"

          register = session.post(base + "/api/auth/register", json={
              "username": "stagingcheck",
              "email": "stagingcheck@example.invalid",
              "password": "OnlyForStagingSmokeCheck_123!"
          }, timeout=20)
          assert register.status_code == 403, f"Registration must remain disabled on staging; got {register.status_code}"
          assert "disabled" in register.text.lower(), "Staging should explicitly report closed registration"

          root = session.get(base + "/", timeout=20)
          assert root.status_code == 200 and "OmniShelf" in root.text, "Staging app shell is unavailable"
          print(json.dumps({
              "stage": "isolated-auth-staging",
              "health_status": health.status_code,
              "database": health.json()["database"],
              "version": health.json()["version"],
              "https_hsts": True,
              "anonymous_state_status": state.status_code,
              "registration_status": register.status_code,
              "root_status": root.status_code
          }, indent=2))
          PY

      - name: Run self-cleaning authenticated HTTPS acceptance against staging
        env:
          OMNISHELF_AUTH_STAGING_URL: https://omnishelf-1-3-8-auth-staging.onrender.com
        run: python scripts/live_staging_auth_acceptance.py

      - name: Capture isolated staging desktop and mobile previews
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          base = "https://omnishelf-1-3-8-auth-staging.onrender.com/"
          with sync_playwright() as p:
              browser = p.chromium.launch()
              desktop = browser.new_page(viewport={"width": 1440, "height": 1100}, device_scale_factor=1)
              errors = []
              desktop.on("pageerror", lambda err: errors.append(str(err)))
              desktop.goto(base, wait_until="domcontentloaded", timeout=60000)
              desktop.wait_for_timeout(2000)
              assert "OmniShelf" in desktop.title()
              if errors:
                  raise AssertionError(f"Staging desktop JavaScript errors: {errors}")
              desktop.screenshot(path="artifacts/omnishelf-1.3.8-auth-staging-desktop.png", full_page=True)

              mobile = browser.new_page(viewport={"width": 390, "height": 844}, device_scale_factor=1)
              mobile_errors = []
              mobile.on("pageerror", lambda err: mobile_errors.append(str(err)))
              mobile.goto(base, wait_until="domcontentloaded", timeout=60000)
              mobile.wait_for_timeout(2000)
              if mobile_errors:
                  raise AssertionError(f"Staging mobile JavaScript errors: {mobile_errors}")
              if mobile.evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth"):
                  raise AssertionError("Staging mobile layout has horizontal overflow")
              mobile.screenshot(path="artifacts/omnishelf-1.3.8-auth-staging-mobile.png", full_page=True)
              browser.close()
          PY

      - name: Upload isolated staging screenshots
        uses: actions/upload-artifact@v4
        with:
          name: omnishelf-1.3.8-auth-staging-previews
          path: artifacts/*.png
          retention-days: 14
