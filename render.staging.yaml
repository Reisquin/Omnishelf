# Isolated OmniShelf 1.3.9 email-recovery staging only.
# Keep the DATABASE_URL value in Render's private environment settings.
# Never point this service at the existing 1.3.8 preview or Neon main branch.
services:
  - type: web
    name: omnishelf-1-3-9-email-recovery-staging
    runtime: docker
    plan: free
    region: singapore
    branch: feature/1.3.9-email-verification-password-reset
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OMNISHELF_EXPECTED_DATABASE_HOST
        value: ep-proud-scene-ao8eewxp-pooler.c-2.ap-southeast-1.aws.neon.tech
      - key: OMNISHELF_EXPECTED_DATABASE_NAME
        value: neondb
      - key: COOKIE_SECURE
        value: "true"
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: PUBLIC_APP_ORIGIN
        value: https://omnishelf-1-3-9-email-recovery-staging.onrender.com
      - key: FRONTEND_ORIGIN
        value: https://omnishelf-1-3-9-email-recovery-staging.onrender.com
      - key: SESSION_TTL_SECONDS
        value: "2592000"
      - key: MAX_STATE_BYTES
        value: "20971520"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_FROM_NAME
        value: OmniShelf
      - key: OMNISHELF_STAGING_ACCEPTANCE_ENABLED
        value: "false"
      - key: OMNISHELF_STAGING_ACCEPTANCE_ORIGIN
        value: https://omnishelf-1-3-9-email-recovery-staging.onrender.com
      - key: OMNISHELF_STAGING_ACCEPTANCE_REF
        value: refs/heads/feature/1.3.9-email-verification-password-reset
      - key: OMNISHELF_STAGING_ACCEPTANCE_WORKFLOW_REF
        value: Reisquin/Omnishelf/.github/workflows/omnishelf-1-3-9-live-smoke.yml@refs/heads/feature/1.3.9-email-verification-password-reset
      - key: OMNISHELF_SMTP_ACCEPTANCE_ENABLED
        value: "false"
